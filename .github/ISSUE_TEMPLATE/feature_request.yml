name: 功能建议
description: 提出 LanBridge 的使用场景或改进建议。
body:
  - type: textarea
    id: problem
    attributes:
      label: 希望解决的问题
      description: 描述当前场景、遇到的限制及影响。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望行为、适用平台和可接受的替代方案。
    validations:
      required: true
