name: 问题反馈
description: 报告 LanBridge 的可复现问题。
body:
  - type: markdown
    attributes:
      value: 请先阅读 README，并搜索已有问题。不要提交私钥、证书或机器专属信息。
  - type: textarea
    id: environment
    attributes:
      label: 环境与版本
      description: 两端操作系统、Linux 会话类型、源码提交或版本、构建和安装方式。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 按顺序描述操作，并说明出现问题的频率。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏的日志或截图
      description: 请移除真实地址、用户名、证书、私钥和其他敏感信息。
